
[project]
name = "insights"
authors = [
    { name = "Powerful Reporting Tool for Frappe Apps", email = "hello@frappe.io" }
]
description = "Open Source Business Intelligence Tool"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "pandas~=2.3.3",
    "SQLAlchemy==2.0.41",
    "python-telegram-bot==21.4",
    "duckdb~=1.4.3",
    "sqlglot>=30.12.0,<30.18",
    "ibis-framework~=11.0.0",
    "ibis-framework[duckdb]",
    "ibis-framework[mysql]",
    "ibis-framework[sqlite]",
    "ibis-framework[clickhouse]",
    "ibis-framework[postgres]",
    # "ibis-framework[mssql]",
    # "ibis-framework[bigquery]",
    "psycopg[binary]",
]

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"

[tool.bench.assets]
build_dir = "./frontend"
out_dir = "./insights/public/frontend"
index_html_path = "./insights/www/_insights.html"

[project.optional-dependencies]
test = [
    "coverage~=7.10.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]
coverage = "~=7.10.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017",
    "B018",
    "B023",
    "B904",
    "E101",
    "E402",
    "E501",
    "E741",
    "E731",
    # "F401",
    "F403",
    "F405",
    "F722",
    "W191",
    "RUF001",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[project.urls]
Homepage = "https://frappe.io/insights"
Repository = "https://github.com/frappe/insights.git"
"Bug Reports" = "https://github.com/frappe/insights/issues"
